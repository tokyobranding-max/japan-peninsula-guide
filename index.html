<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>日本の半島 ぜんぶ紹介</title>
<style>
:root{--ocean:#0796d2;--deep:#057cb9;--land:#2f9345;--land2:#65b84d;--sand:#fff2a3;--ink:#073c67;--white:#fff}
*{box-sizing:border-box} body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;color:#fff;background:linear-gradient(160deg,var(--ocean),var(--deep));min-height:100vh}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.18;background:repeating-radial-gradient(ellipse at 20% 10%,transparent 0 22px,#d9f6ff 23px 24px,transparent 25px 48px)}
header{padding:34px clamp(18px,4vw,58px) 22px;display:flex;gap:28px;align-items:flex-end;justify-content:space-between;position:relative}
h1{font-size:clamp(34px,5vw,74px);line-height:.95;margin:0;font-weight:900;letter-spacing:-.04em}.sub{font-size:clamp(16px,2vw,27px);font-weight:800;margin-top:14px}.eyebrow{font-size:12px;letter-spacing:.18em;border-left:2px solid #fff;padding-left:14px;line-height:1.7}
.toolbar{position:sticky;top:0;z-index:5;padding:10px clamp(18px,4vw,58px);display:flex;gap:10px;flex-wrap:wrap;background:rgba(3,116,173,.9);backdrop-filter:blur(10px);border-block:1px solid rgba(255,255,255,.2)}
input,select{border:0;border-radius:8px;padding:11px 13px;font-size:15px;min-width:180px;background:#fff;color:#123}
main{padding:22px clamp(18px,4vw,58px) 60px;display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:24px;align-items:start;position:relative}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:14px}
.card{border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);border-radius:14px;padding:12px;color:#fff;text-align:left;cursor:pointer;transition:.18s ease;min-height:178px}
.card:hover,.card:focus,.card.active{transform:translateY(-3px);background:rgba(255,255,255,.17);outline:3px solid rgba(255,242,163,.7);outline-offset:1px}
.pen{height:94px;display:grid;place-items:center}.blob{width:72px;height:82px;background:radial-gradient(circle at 45% 35%,#78c657 0 15%,var(--land2) 16% 38%,var(--land) 39% 100%);border:7px solid var(--sand);box-shadow:0 0 0 5px rgba(255,255,255,.5),0 0 0 10px rgba(170,236,255,.28);border-radius:58% 42% 64% 36%/48% 56% 44% 52%;transform:rotate(var(--r))}
.num{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:#ffe66f;color:#073c67;font-weight:900;margin-right:6px}.name{font-weight:900;font-size:17px}.meta{font-size:12px;opacity:.9;margin-top:6px}.area{font-weight:900;font-size:18px;margin-top:4px}
.detail{position:sticky;top:72px;background:#f7fbfd;color:var(--ink);border-radius:16px;padding:22px;box-shadow:0 14px 38px rgba(0,50,90,.18)}
.detail h2{font-size:29px;margin:8px 0 2px}.detail .big{font-size:34px;font-weight:900;margin:16px 0}.tag{display:inline-block;background:#ffe66f;padding:5px 9px;border-radius:999px;font-size:12px;font-weight:900}.detail p{line-height:1.75;margin:12px 0}.hint{font-size:12px;opacity:.7;border-top:1px solid #c9dbe5;padding-top:14px}
footer{padding:0 clamp(18px,4vw,58px) 34px;font-size:12px;opacity:.85}
@media(max-width:850px){main{grid-template-columns:1fr}.detail{position:relative;top:auto;order:-1}header{align-items:flex-start;flex-direction:column}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:430px){.grid{grid-template-columns:1fr 1fr}.card{padding:9px}.name{font-size:14px}.area{font-size:15px}.pen{height:80px}.blob{transform:scale(.85) rotate(var(--r))}}
</style>
</head>
<body>
<header>
 <div><h1>日本の半島<br>ぜんぶ紹介</h1><div class="sub">海に突き出た、それぞれの個性。</div></div>
 <div class="eyebrow">JAPAN PENINSULA GUIDE<br>半島から、次の日本をつくる。</div>
</header>
<div class="toolbar">
 <input id="q" aria-label="半島を検索" placeholder="半島名・都道府県で検索">
 <select id="pref" aria-label="都道府県で絞り込み"><option value="">全国</option></select>
 <select id="sort" aria-label="並び順"><option value="area">大きい順</option><option value="name">五十音順</option></select>
</div>
<main>
 <section class="grid" id="grid" aria-label="半島一覧"></section>
 <aside class="detail" id="detail" aria-live="polite">
   <span class="tag">PENINSULA GUIDE</span>
   <h2>半島を選んでください</h2>
   <p>マウスを重ねるか、タップすると詳細が表示されます。</p>
   <p class="hint">PCではマウスオーバー、スマートフォンではタップで操作できます。</p>
 </aside>
</main>
<footer>※ 面積は元インフォグラフィック掲載の概算値です。半島の境界定義により数値が異なる場合があります。地形シルエットは演出用の模式図で、実際の海岸線形状ではありません。</footer>
<script>
const DATA=[{"id": 1, "name": "紀伊半島", "pref": "三重・奈良・和歌山県", "area": 17300}, {"id": 2, "name": "渡島半島", "pref": "北海道", "area": 6520}, {"id": 3, "name": "房総半島", "pref": "千葉県", "area": 5156}, {"id": 4, "name": "薩摩半島", "pref": "鹿児島県", "area": 3020}, {"id": 5, "name": "大隅半島", "pref": "鹿児島・宮崎県", "area": 2638}, {"id": 6, "name": "伊豆半島", "pref": "静岡県", "area": 2543}, {"id": 7, "name": "能登半島", "pref": "石川県", "area": 1858}, {"id": 8, "name": "下北半島", "pref": "青森県", "area": 1496}, {"id": 9, "name": "津軽半島", "pref": "青森県", "area": 1399}, {"id": 10, "name": "島根半島", "pref": "島根県", "area": 1105}, {"id": 11, "name": "積丹半島", "pref": "北海道", "area": 1013}, {"id": 12, "name": "国東半島", "pref": "大分県", "area": 738}, {"id": 13, "name": "島原半島", "pref": "長崎県", "area": 463}, {"id": 14, "name": "三浦半島", "pref": "神奈川県", "area": 356}, {"id": 15, "name": "西彼杵半島", "pref": "長崎県", "area": 325}, {"id": 16, "name": "丹後半島", "pref": "京都府", "area": 313}, {"id": 17, "name": "知多半島", "pref": "愛知県", "area": 303}, {"id": 18, "name": "男鹿半島", "pref": "秋田県", "area": 87}, {"id": 19, "name": "渥美半島", "pref": "愛知県", "area": 85}, {"id": 20, "name": "仙台湾半島", "pref": "宮城県", "area": 82}, {"id": 21, "name": "江能倉橋島半島", "pref": "広島県", "area": 80}, {"id": 22, "name": "室津半島", "pref": "兵庫県", "area": 73}, {"id": 23, "name": "弓ヶ浜半島", "pref": "鳥取県", "area": 72}, {"id": 24, "name": "児島半島", "pref": "岡山県", "area": 69}, {"id": 25, "name": "荘内半島", "pref": "香川県", "area": 66}, {"id": 26, "name": "大矢野半島", "pref": "熊本県", "area": 55}, {"id": 27, "name": "宇土半島", "pref": "熊本県", "area": 53}, {"id": 28, "name": "天草下島（崎津半島）", "pref": "熊本県", "area": 48}, {"id": 29, "name": "長崎半島", "pref": "長崎県", "area": 45}, {"id": 30, "name": "野辺地半島", "pref": "青森県", "area": 45}, {"id": 31, "name": "榊島半島", "pref": "長崎県", "area": 42}, {"id": 32, "name": "吹上半島", "pref": "鹿児島県", "area": 40}, {"id": 33, "name": "中村半島", "pref": "高知県", "area": 38}, {"id": 34, "name": "大間半島", "pref": "青森県", "area": 36}, {"id": 35, "name": "巣鴨島半島", "pref": "北海道", "area": 35}, {"id": 36, "name": "浜名半島", "pref": "静岡県", "area": 34}, {"id": 37, "name": "日生半島", "pref": "岡山県", "area": 32}, {"id": 38, "name": "鎮江半島", "pref": "鹿児島県", "area": 31}, {"id": 39, "name": "内海半島", "pref": "愛媛県", "area": 28}, {"id": 40, "name": "田原半島", "pref": "愛知県", "area": 26}, {"id": 41, "name": "大島半島", "pref": "山口県", "area": 24}, {"id": 42, "name": "沖ノ島半島", "pref": "千葉県", "area": 22}, {"id": 43, "name": "都井岬半島", "pref": "宮崎県", "area": 20}, {"id": 44, "name": "女川半島", "pref": "宮城県", "area": 18}, {"id": 45, "name": "唐桑半島", "pref": "宮城県", "area": 16}, {"id": 46, "name": "北浦半島", "pref": "宮崎県", "area": 14}, {"id": 47, "name": "崎戸半島", "pref": "長崎県", "area": 12}, {"id": 48, "name": "都志半島", "pref": "兵庫県", "area": 10}, {"id": 49, "name": "志摩半島", "pref": "三重県", "area": 8}, {"id": 50, "name": "日向半島", "pref": "宮崎県", "area": 6}];
const grid=document.getElementById('grid'), detail=document.getElementById('detail'), q=document.getElementById('q'), pref=document.getElementById('pref'), sort=document.getElementById('sort');
[...new Set(DATA.flatMap(d=>d.pref.split(/[・]/)))].sort((a,b)=>a.localeCompare(b,'ja')).forEach(p=>{const o=document.createElement('option');o.value=p;o.textContent=p;pref.appendChild(o)});
function scaleLabel(a){return a>=5000?'超大型':a>=1000?'大型':a>=300?'中大型':a>=100?'中型':'コンパクト'}
function show(d,card){
 document.querySelectorAll('.card').forEach(x=>x.classList.remove('active')); if(card) card.classList.add('active');
 detail.innerHTML=`<span class="tag">${scaleLabel(d.area)} PENINSULA</span><h2>${d.name}</h2><div>${d.pref}</div><div class="big">約 ${d.area.toLocaleString()} km²</div><p>海へ張り出す地形が、周囲の海・山・気候・産業・文化と結びつき、その地域ならではの暮らしを育てています。</p><p><strong>このサイトでの位置づけ：</strong>元画像の紹介順では No.${d.id}。面積値は元インフォグラフィックの掲載値を使用しています。</p><p class="hint">※ 境界の取り方によって面積は変わります。地形シルエットは模式図です。</p>`;
}
function render(){
 const term=q.value.trim().toLowerCase(), p=pref.value;
 let rows=DATA.filter(d=>(!term||(d.name+d.pref).toLowerCase().includes(term))&&(!p||d.pref.includes(p)));
 rows.sort(sort.value==='name'?(a,b)=>a.name.localeCompare(b.name,'ja'):(a,b)=>b.area-a.area);
 grid.innerHTML='';
 rows.forEach((d,i)=>{
   const b=document.createElement('button');b.type='button';b.className='card';b.style.setProperty('--r',`${((d.id*37)%70)-35}deg`);
   b.innerHTML=`<div class="pen"><div class="blob" aria-hidden="true"></div></div><div><span class="num">${d.id}</span><span class="name">${d.name}</span></div><div class="meta">${d.pref}</div><div class="area">約 ${d.area.toLocaleString()} km²</div>`;
   b.addEventListener('mouseenter',()=>show(d,b));b.addEventListener('focus',()=>show(d,b));b.addEventListener('click',()=>show(d,b));grid.appendChild(b);
 });
 if(!rows.length) grid.innerHTML='<p>該当する半島がありません。</p>';
}
[q,pref,sort].forEach(el=>el.addEventListener(el.tagName==='INPUT'?'input':'change',render));render();show(DATA[0]);
</script>
</body></html>
